name: Pin Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pin-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pin-check:
    permissions:
      contents: read
    uses: rarebit-one/.github/.github/workflows/pin-check.yml@main
